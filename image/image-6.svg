<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="680" height="430" role="img" aria-label="Graphique de la vitesse en fonction du temps d'un parachutiste">
<title>Vitesse d'un parachutiste en fonction du temps</title>
<defs><marker id="ax" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#212529"></path></marker></defs>
<rect width="680" height="430" fill="#ffffff"></rect>
<text x="340" y="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#212529">Vitesse du parachutiste en fonction du temps</text>
<g stroke="#e9ecef" stroke-width="1"><line x1="80" y1="310" x2="640" y2="310"></line><line x1="80" y1="260" x2="640" y2="260"></line><line x1="80" y1="210" x2="640" y2="210"></line><line x1="80" y1="160" x2="640" y2="160"></line><line x1="80" y1="110" x2="640" y2="110"></line><line x1="150" y1="60" x2="150" y2="360"></line><line x1="220" y1="60" x2="220" y2="360"></line><line x1="290" y1="60" x2="290" y2="360"></line><line x1="360" y1="60" x2="360" y2="360"></line><line x1="430" y1="60" x2="430" y2="360"></line><line x1="500" y1="60" x2="500" y2="360"></line><line x1="570" y1="60" x2="570" y2="360"></line><line x1="640" y1="60" x2="640" y2="360"></line></g>
<line x1="390" y1="60" x2="390" y2="360" stroke="#868e96" stroke-width="1.5" stroke-dasharray="6 5"></line>
<text x="396" y="76" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#495057">Ouverture du parachute</text>
<line x1="80" y1="110" x2="390" y2="110" stroke="#1971c2" stroke-width="1.5" stroke-dasharray="6 5"></line>
<text x="88" y="102" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1971c2">Vitesse ultime (F<tspan font-size="9" dy="3">f</tspan><tspan dy="-3"> = F</tspan><tspan font-size="9" dy="3">g</tspan><tspan dy="-3">)</tspan></text>
<line x1="390" y1="322" x2="640" y2="322" stroke="#1971c2" stroke-width="1.5" stroke-dasharray="6 5"></line>
<text x="470" y="312" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1971c2">Nouvelle vitesse ultime, plus faible</text>
<path d="M80,360 C160,170 230,112 330,110 L390,110 C400,250 415,318 460,322 L640,322" fill="none" stroke="#5f3dc4" stroke-width="4" stroke-linejoin="round"></path>
<line x1="80" y1="360" x2="655" y2="360" stroke="#212529" stroke-width="2" marker-end="url(#ax)"></line>
<line x1="80" y1="360" x2="80" y2="45" stroke="#212529" stroke-width="2" marker-end="url(#ax)"></line>
<text x="360" y="395" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#212529">Temps (s)</text>
<text x="40" y="210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#212529" transform="rotate(-90 40 210)">Vitesse (m/s)</text>
<text x="72" y="376" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#495057">0</text>
<circle cx="104" cy="342" r="13" fill="#343a40"></circle><text x="104" y="347" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#fff">1</text><circle cx="172.37999999999997" cy="236.58799999999997" r="13" fill="#343a40"></circle><text x="172.37999999999997" y="241.58799999999997" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#fff">2</text><circle cx="300" cy="132" r="13" fill="#343a40"></circle><text x="300" y="137" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#fff">3</text><circle cx="432.8156250000001" cy="255.98900000000006" r="13" fill="#343a40"></circle><text x="432.8156250000001" y="260.98900000000003" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#fff">4</text><text x="340" y="420" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#495057">Les numéros correspondent aux schémas 1 à 4.</text>
</svg>